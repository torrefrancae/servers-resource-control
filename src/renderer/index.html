<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>PC monitor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-theme="dark">
    <div class="shell" id="shell">
      <header class="bar">
        <span class="brand">servers</span>
        <div class="actions">
          <button
            type="button"
            class="chip chip-warn"
            id="global-toggle"
            title="Global actions"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="global-modal"
          >
            global
          </button>
          <button
            type="button"
            class="chip chip-pin-timer"
            id="hover-pin-timer"
            title="Click to send behind for 5s"
            hidden
          >
            on top
          </button>
          <div class="timer-edit" id="timer-edit" hidden>
            <input
              id="timer-input"
              class="timer-input"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              spellcheck="false"
              maxlength="5"
              placeholder="HH:MM"
              title="24-hour time, e.g. 23:30"
              aria-label="Sleep all time HH:MM"
            />
            <button type="button" class="chip chip-warn" id="timer-set" title="Arm sleep-all timer">
              set
            </button>
            <button type="button" class="chip chip-icon" id="timer-cancel-edit" title="Cancel">
              x
            </button>
          </div>
          <button type="button" class="chip" id="fleet" title="Show fleet summary" aria-pressed="false">
            fleet
          </button>
          <button
            type="button"
            class="chip"
            id="hosts-toggle"
            title="Hosts settings"
            aria-pressed="false"
            aria-controls="settings-view"
          >
            hosts
          </button>
          <button
            type="button"
            class="chip"
            id="app-toggle"
            title="App options"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="app-modal"
          >
            app
          </button>
          <button type="button" class="chip chip-icon" id="theme" title="Light mode">
            L
          </button>
          <button type="button" class="chip chip-icon chip-danger" id="quit" title="Quit">
            x
          </button>
        </div>
      </header>
      <main id="hosts" class="hosts" aria-live="polite"></main>
      <section class="settings-view" id="settings-view" hidden aria-label="Hosts settings">
        <aside class="settings-rail">
          <div class="settings-rail-head">hosts</div>
          <div class="settings-host-list" id="settings-host-list"></div>
          <button type="button" class="action-option" id="hosts-add">add host</button>
        </aside>
        <div class="settings-detail">
          <div class="settings-detail-head">
            <div class="settings-detail-title" id="settings-detail-title">Select a host</div>
            <label class="settings-enable">
              <input type="checkbox" form="settings-host-form" name="enabled" />
              <span>enabled</span>
            </label>
          </div>
          <form class="settings-form" id="settings-host-form" autocomplete="off">
            <label class="settings-field">
              <span>label</span>
              <input name="label" type="text" maxlength="40" required />
            </label>
            <label class="settings-field">
              <span>kind</span>
              <select name="kind">
                <option value="darwin">darwin</option>
                <option value="linux">linux</option>
              </select>
            </label>
            <label class="settings-field">
              <span>ssh host</span>
              <input name="sshHost" type="text" placeholder="name.local" />
            </label>
            <label class="settings-field">
              <span>port</span>
              <input name="sshPort" type="number" min="1" max="65535" value="22" />
            </label>
            <label class="settings-field">
              <span>user</span>
              <input name="sshUser" type="text" autocomplete="username" />
            </label>
            <label class="settings-field">
              <span>password</span>
              <input name="sshPassword" type="password" autocomplete="current-password" />
            </label>
          </form>
          <div class="settings-detail-actions">
            <button type="button" class="action-option" id="hosts-close">close</button>
            <button type="button" class="action-option" id="hosts-duplicate" title="Clone selected host creds with a new hostname">
              duplicate
            </button>
            <button type="button" class="action-option chip-active" id="hosts-save">save</button>
          </div>
        </div>
      </section>
      <footer class="foot" id="foot">polling...</footer>
      <div class="resize-grip" aria-hidden="true" title="Drag corner to resize"></div>
      <div class="action-modal" id="global-modal" hidden>
        <button type="button" class="action-modal-backdrop" id="global-backdrop" aria-label="Close global actions"></button>
        <div class="action-modal-card cols-2" role="dialog" aria-modal="true" aria-label="Global actions">
          <button type="button" class="action-option chip-warn" data-global="restart-all">
            restart all
          </button>
          <button type="button" class="action-option chip-warn" data-global="sleep-all">
            sleep all
          </button>
          <button type="button" class="action-option" id="sleep-timer" data-global="timer-all">
            timer all
          </button>
          <button
            type="button"
            class="action-option"
            id="auto-sleep"
            data-global="auto-sleep"
            title="Loading auto-sleep schedule..."
            aria-pressed="false"
          >
            disable auto sleep
          </button>
        </div>
      </div>
      <div class="action-modal" id="app-modal" hidden>
        <button type="button" class="action-modal-backdrop" id="app-backdrop" aria-label="Close app options"></button>
        <div class="action-modal-card cols-2" role="dialog" aria-modal="true" aria-label="App options">
          <button type="button" class="action-option" data-app="restart">
            restart app
          </button>
          <button type="button" class="action-option chip-active" id="pin" data-app="pin" aria-pressed="true">
            always on top
          </button>
          <button
            type="button"
            class="action-option"
            id="units-toggle"
            data-app="units"
            aria-pressed="false"
            title="Toggle percent vs absolute units"
          >
            percent
          </button>
        </div>
      </div>
      <div class="action-modal" id="host-modal" hidden>
        <button type="button" class="action-modal-backdrop" id="host-backdrop" aria-label="Close host actions"></button>
        <div class="action-modal-card cols-2" role="dialog" aria-modal="true" aria-labelledby="host-modal-title">
          <div class="action-modal-title" id="host-modal-title">host</div>
          <button type="button" class="action-option chip-warn" data-host-action="sleep">
            sleep
          </button>
          <button type="button" class="action-option chip-warn" data-host-action="restart">
            restart
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
