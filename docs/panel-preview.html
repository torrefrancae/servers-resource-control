<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Servers Resource Control preview</title>
    <style>
      :root {
        --bg: rgba(18, 22, 28, 0.96);
        --bg-top: rgba(28, 34, 44, 0.98);
        --glow: rgba(61, 186, 139, 0.12);
        --line: rgba(255, 255, 255, 0.08);
        --text: #e8edf4;
        --muted: #8b97a8;
        --ok: #3dba8b;
        --warn: #d4a017;
        --hot: #e0654a;
        --track: rgba(255, 255, 255, 0.1);
        --btn-hover: rgba(255, 255, 255, 0.1);
        --btn-fill: rgba(255, 255, 255, 0.05);
        --chip-warn-bg: rgba(224, 101, 74, 0.14);
        --chip-warn-border: rgba(224, 101, 74, 0.35);
        --chip-ok-bg: rgba(61, 186, 139, 0.12);
        --chip-ok-border: rgba(61, 186, 139, 0.35);
        --font: "IBM Plex Mono", "SF Mono", "Menlo", monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1100px;
        height: 168px;
        overflow: hidden;
        background: #0b0e12;
        font-family: var(--font);
        color: var(--text);
      }
      .shell {
        height: 100%;
        margin: 4px;
        padding: 10px 12px 8px;
        border-radius: 14px;
        background:
          radial-gradient(120% 80% at 0% 0%, var(--glow), transparent 55%),
          linear-gradient(160deg, var(--bg-top), var(--bg));
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 18px;
      }
      .brand {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .actions { display: flex; gap: 4px; align-items: center; }
      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--btn-fill);
        color: var(--muted);
        font: inherit;
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 4px 8px;
        line-height: 1.2;
      }
      .chip-warn {
        color: var(--hot);
        background: var(--chip-warn-bg);
        border-color: var(--chip-warn-border);
      }
      .chip-active {
        color: var(--ok);
        background: var(--chip-ok-bg);
        border-color: var(--chip-ok-border);
      }
      .chip-icon { width: 22px; height: 22px; padding: 0; text-align: center; }
      .hosts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0;
        flex: 1;
        min-height: 0;
      }
      .row {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 4px;
        padding: 0 10px;
        border-left: 1px solid var(--line);
        min-width: 0;
      }
      .row:first-child { border-left: 0; padding-left: 0; }
      .row:last-child { padding-right: 0; }
      .host-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .host-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #555; flex: 0 0 auto;
      }
      .dot.on { background: var(--ok); box-shadow: 0 0 6px rgba(61, 186, 139, 0.55); }
      .name {
        font-size: 12px; font-weight: 600;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .meters { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .meter {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) 40px;
        gap: 6px;
        align-items: center;
        font-size: 10px;
        color: var(--muted);
      }
      .track {
        height: 5px; border-radius: 999px; background: var(--track); overflow: hidden;
      }
      .fill { height: 100%; border-radius: inherit; background: var(--ok); }
      .fill.warn { background: var(--warn); }
      .fill.hot { background: var(--hot); }
      .val { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
      .foot {
        font-size: 10px; color: var(--muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <span class="brand">servers</span>
        <div class="actions">
          <span class="chip chip-warn">global</span>
          <span class="chip">fleet</span>
          <span class="chip">hosts</span>
          <span class="chip">app</span>
          <span class="chip chip-icon">L</span>
          <span class="chip chip-icon">x</span>
        </div>
      </header>
      <main class="hosts">
        <section class="row">
          <div class="host-meta">
            <div class="host-title"><span class="dot on"></span><div class="name">this-machine</div></div>
            <span class="chip">power</span>
          </div>
          <div class="meters">
            <div class="meter"><span>cpu</span><div class="track"><div class="fill" style="width:22%"></div></div><span class="val">22%</span></div>
            <div class="meter"><span>mem</span><div class="track"><div class="fill" style="width:50%"></div></div><span class="val">50%</span></div>
            <div class="meter"><span>gpu</span><div class="track"><div class="fill" style="width:19%"></div></div><span class="val">19%</span></div>
            <div class="meter"><span>disk</span><div class="track"><div class="fill warn" style="width:76%"></div></div><span class="val">76%</span></div>
          </div>
        </section>
        <section class="row">
          <div class="host-meta">
            <div class="host-title"><span class="dot on"></span><div class="name">linux-lab</div></div>
            <span class="chip">power</span>
          </div>
          <div class="meters">
            <div class="meter"><span>cpu</span><div class="track"><div class="fill" style="width:8%"></div></div><span class="val">8%</span></div>
            <div class="meter"><span>mem</span><div class="track"><div class="fill" style="width:11%"></div></div><span class="val">11%</span></div>
            <div class="meter"><span>gpu</span><div class="track"><div class="fill" style="width:0%"></div></div><span class="val">0%</span></div>
            <div class="meter"><span>disk</span><div class="track"><div class="fill" style="width:27%"></div></div><span class="val">27%</span></div>
          </div>
        </section>
        <section class="row">
          <div class="host-meta">
            <div class="host-title"><span class="dot on"></span><div class="name">mac-lab</div></div>
            <span class="chip">power</span>
          </div>
          <div class="meters">
            <div class="meter"><span>cpu</span><div class="track"><div class="fill" style="width:21%"></div></div><span class="val">21%</span></div>
            <div class="meter"><span>mem</span><div class="track"><div class="fill" style="width:55%"></div></div><span class="val">55%</span></div>
            <div class="meter"><span>gpu</span><div class="track"><div class="fill" style="width:0%"></div></div><span class="val">0%</span></div>
            <div class="meter"><span>disk</span><div class="track"><div class="fill warn" style="width:68%"></div></div><span class="val">68%</span></div>
          </div>
        </section>
      </main>
      <footer class="foot">3/3 up · cpu / mem / gpu / disk</footer>
    </div>
  </body>
</html>
